name: Raaga
options:
  bundleIdPrefix: com.pdasika
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
packages:
  RaagaCore:
    path: Packages/RaagaCore
targets:
  Raaga:
    type: application
    platform: iOS
    sources:
      - path: Raaga
    dependencies:
      - package: RaagaCore
    info:
      path: Raaga/Info.plist
      properties:
        CFBundleDisplayName: Raaga
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSMicrophoneUsageDescription: Raaga listens to your voice to show which note you are singing and to record practice sessions.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Set this to your Apple ID team in Xcode (Signing & Capabilities) or here:
        # DEVELOPMENT_TEAM: XXXXXXXXXX
