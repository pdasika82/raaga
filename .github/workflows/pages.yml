# Publishes web/ to https://pdasika82.github.io/raaga/. Requires a public repo (free plan) and Pages source set to "GitHub Actions".
name: Deploy web app to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/src/**', 'web2/**', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build Raaga (web2) at the site root
        run: npm ci && npm run build
        working-directory: web2
        env:
          BASE_PATH: /raaga/
      - name: Assemble the site
        run: |
          rm -rf ../_site && mkdir -p ../_site
          cp -r ../web2/dist/. ../_site/
          cp -r ../site/. ../_site/
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
